org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Same loom/loader/Fabric API versions as kintil555/MinimalsClient (known to build for 26.2).
# Minecraft 26.2 is unobfuscated: Mojang names are used directly, no mappings.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.15.2
fabric_api_version=0.157.0+26.2

# GeckoLib 5. A jar in libs/ takes precedence over the Maven repository.
geckolib_version=5.5.5

mod_version=0.5.0
maven_group=io.github.kintil555
archives_base_name=bedrockpackloader
